[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-graph-search-algorithms"
version = "0.1.0"
description = "Python implementations of BFS, DFS, Greedy Best-First Search and A* over CSV graph inputs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
graph-search = "graph_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
